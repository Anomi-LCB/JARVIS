// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  tasks.withType(JavaCompile).configureEach {
    doFirst {
      def expoPackageJson = ["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim()
      if (!expoPackageJson) {
        return
      }
      def expoPackageList = new File(new File(expoPackageJson).getParentFile(), "android/build/generated/expo/src/main/java/expo/modules/ExpoModulesPackageList.java")
      if (!expoPackageList.exists()) {
        return
      }
      def current = expoPackageList.getText("UTF-8")
      def patched = current.replaceAll("(?m)^\\s*expo\\.modules\\.fetch\\.ExpoFetchModule\\.class,\\r?\\n", "")
      if (patched != current) {
        expoPackageList.write(patched, "UTF-8")
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
