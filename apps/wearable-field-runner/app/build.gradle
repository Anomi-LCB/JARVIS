plugins {
  id 'com.android.application'
}

android {
  namespace 'local.eureka.jarvis.wearablefield'
  compileSdk 35

  defaultConfig {
    applicationId 'local.eureka.jarvis.wearablefield'
    minSdk 23
    targetSdk 35
    versionCode 1
    versionName '1.0.0'
    buildConfigField 'String', 'DEFAULT_FIELD_URL', '"http://127.0.0.1:4176/field-calibration.html"'
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    debug {
      debuggable false
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError true
    checkReleaseBuilds true
  }
}
